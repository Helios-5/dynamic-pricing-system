[pytest]
# Always run in verbose mode so individual test names are visible.
# --tb=short keeps tracebacks concise — full tracebacks are available
# with --tb=long if you need to dig deeper.
# --durations=10 prints the 10 slowest tests at the end of every run.
# This is cheap to do and invaluable for catching accidentally slow tests
# before they make the CI pipeline frustratingly long.
addopts = -v --tb=short --durations=10

testpaths = tests

# Suppress the PuLP "no module named ..." warnings that appear when PuLP
# can't find optional solvers (GLPK, CPLEX, etc.).  We only use CBC which
# ships with PuLP, so these warnings are noise.
filterwarnings =
    ignore::UserWarning:pulp
